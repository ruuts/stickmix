name: Build StickMix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: windows-2022
            platform: windows
            arch: x64
          - os: macos-15-intel
            platform: macos
            arch: x64
          - os: macos-15
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --package stickmix --check
      - run: cargo test --locked
      - run: cargo test --locked -p sustain-pioneer
      - run: cargo clippy --locked --package stickmix --all-targets -- -D warnings
      - run: cargo build --release --locked
      - name: Collect corresponding dependency sources
        run: cargo vendor --locked --versioned-dirs .build/dependency-source
      - name: Package and run native smoke tests
        run: python packaging/package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: StickMix-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/StickMix-${{ matrix.platform }}-${{ matrix.arch }}.zip
